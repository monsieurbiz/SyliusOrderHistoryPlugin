name: Tests

on:
    push:
        branches: [ master, review-colleague-sylius-2 ]
    pull_request:

jobs:

    php:

        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                sylius: ['2.0.0', '2.1.0', '2.2.0']

        env:
            SYMFONY_ARGS: --no-tls
            COMPOSER_ARGS: --prefer-dist
            DOCKER_INTERACTIVE_ARGS: -t

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '20'
            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.3'
                  ini-values: date.timezone=UTC
                  tools: symfony-cli

            - name: Set project php-version
              run: |
                  echo '8.3' > .php-version

            - name: Determine composer cache directory
              id: composer-cache-directory
              run: echo "directory=$(composer config cache-dir)" >> $GITHUB_OUTPUT

            - name: Cache dependencies installed with composer
              uses: actions/cache@v3
              id: cache-composer
              with:
                  path: ${{ steps.composer-cache-directory.outputs.directory }}
                  key: composer2-php:8.3-sylius:${{ matrix.sylius }}-${{ github.sha }}
                  restore-keys: composer2-php:8.3-sylius:${{ matrix.sylius }}-

            - name: Ensure that composer cache directory exists
              run: mkdir -p ${{ steps.composer-cache-directory.outputs.directory }}

            - name: Composer Github Auth
              run: composer config -g github-oauth.github.com ${{ github.token }}

            - run: make install SYLIUS_VERSION=${{ matrix.sylius }}

            - run: make test.composer

            - run: make test.phpcs

            - run: make test.phpstan

            - run: make test.phpmd

            - run: make test.yaml

            - run: make test.twig

            - run: make test.schema

            - run: make test.container

            - run: make test.functional
