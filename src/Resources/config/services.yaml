services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    _instanceof:
        MonsieurBiz\SyliusOrderHistoryPlugin\Notifier\OrderHistoryNotifierInterface:
            public: true

    MonsieurBiz\SyliusOrderHistoryPlugin\:
        resource: '../../*'
        exclude: '../../{Entity,Migrations}'

    MonsieurBiz\SyliusOrderHistoryPlugin\Notifier\OrderHistoryNotifierInterface $orderHistoryNotifier: '@MonsieurBiz\SyliusOrderHistoryPlugin\Notifier\OrderHistoryNotifier'
    MonsieurBiz\SyliusOrderHistoryPlugin\Notifier\OrderHistoryNotifierInterface $orderHistoryWithAddressesDataNotifier: '@MonsieurBiz\SyliusOrderHistoryPlugin\Notifier\OrderHistoryWithAddressesDataNotifier'
    MonsieurBiz\SyliusOrderHistoryPlugin\Notifier\OrderHistoryNotifierInterface $orderHistoryWithPaymentDataNotifier: '@MonsieurBiz\SyliusOrderHistoryPlugin\Notifier\OrderHistoryWithPaymentDataNotifier'
    MonsieurBiz\SyliusOrderHistoryPlugin\Notifier\OrderHistoryNotifierInterface $orderHistoryWithShipmentDataNotifier: '@MonsieurBiz\SyliusOrderHistoryPlugin\Notifier\OrderHistoryWithShipmentDataNotifier'

    MonsieurBiz\SyliusOrderHistoryPlugin\Component\OrderHistory:
        autoconfigure: false
        arguments:
            - '@monsieurbiz_order_history.repository.order_history_event'
#            - '@form.factory'
#            - '%monsieurbiz_cms_page.model.page.class%'
#            - 'MonsieurBiz\SyliusCmsPagePlugin\Form\Type\PageType'
        tags:
            - { name: 'sylius.live_component.admin', key: 'sylius_admin:monsieurbiz_order_history:order_history' }
